name: checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  deterministic:
    name: Context, startup and tests (Python ${{ matrix.python }})
    runs-on: ubuntu-latest
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.13"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - name: Verify pinned context
        run: python3 -B scripts/check_context.py
      - name: Load the shared core read-only
        run: python3 -B scripts/startup.py read --explore > /dev/null
      - name: Run the deterministic test suite
        run: python3 -B -m unittest discover -s tests -v

  pr-metadata:
    name: PR metadata
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read  # confirms a design approval PR is merged
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Branch name, issue link, no home paths or secrets added, karen-profile checks
        run: python3 -B scripts/check_pr.py
        env:
          GH_TOKEN: ${{ github.token }}
